[project]
name = "scalper"
version = "0.1.0"
description = "Personal Nifty 50 futures intraday scalping system. Phase 2 records Nifty futures ticks and depth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "asyncpg>=0.30",
    "redis>=5.0",
    "kiteconnect>=5.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
scalper = "scalper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
