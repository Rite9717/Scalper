# Local skeleton. The default database password is for a workstation only.
# Change it before this stack holds a session or market data on a VPS.
# Published ports are bound to 127.0.0.1. The app reaches Postgres and Redis
# over the compose network. This process does not place orders.

name: scalper

services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg16
    environment:
      POSTGRES_USER: scalper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalper}
      POSTGRES_DB: scalper
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalper -d scalper"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Kolkata
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Kolkata
      SCALPER_TRADING_MODE: paper
      SCALPER_LOG_JSON: "true"
      SCALPER_LOG_LEVEL: INFO
      SCALPER_DATABASE_URL: postgresql://scalper:${POSTGRES_PASSWORD:-scalper}@postgres:5432/scalper
      SCALPER_REDIS_URL: redis://redis:6379/0
      SCALPER_DATA_DIR: /var/lib/scalper
      SCALPER_SESSION_PATH: /var/lib/scalper/session.json
      SCALPER_INSTRUMENT_ARCHIVE_DIR: /var/lib/scalper/instruments
    volumes:
      - ./data:/var/lib/scalper
    command: ["python", "-m", "scalper", "serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
